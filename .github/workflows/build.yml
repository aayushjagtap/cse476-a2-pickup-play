# CI-only: builds the debug APK, runs the app on an emulator to check the three tasks and
# rotation, captures screenshots, and publishes everything to the `ci-results` branch.
name: Build and check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 36
        id: sdk
        shell: bash
        run: |
          mkdir -p out
          {
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/platforms" || true
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          } 2>&1 | tee out/sdk.log

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          mkdir -p out
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee out/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/PickupPlay.apk

      - name: Lint (report only)
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew lintDebug --no-daemon -Dlint.abortOnError=false 2>&1 | tail -40 > out/lint.log || true
          cp app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.html out/ 2>/dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tasks on emulator and capture screenshots
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r out/PickupPlay.apk
            python3 ci/ui_check.py out 2>&1 | tee out/ui_check.log
            adb logcat -d > out/logcat.txt || true

      - name: Publish results to ci-results branch
        if: always()
        shell: bash
        run: |
          mkdir -p out
          echo "commit: ${GITHUB_SHA}" > out/RUN.txt
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> out/RUN.txt
          echo "status: ${{ job.status }}" >> out/RUN.txt
          echo "java: ${{ steps.java.outcome }}  sdk: ${{ steps.sdk.outcome }}  build: ${{ steps.build.outcome }}  emulator: ${{ steps.emulator.outcome }}" >> out/RUN.txt
          cd out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
