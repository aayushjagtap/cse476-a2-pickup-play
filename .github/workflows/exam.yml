name: Exam build and check

on:
  push:
    branches: [exam]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK packages
        shell: bash
        run: |
          mkdir -p out
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" > out/sdk.log 2>&1

      - name: Build all three projects
        shell: bash
        run: |
          set -o pipefail
          for p in LakeLog LakeKit-measure LakeKit; do
            mkdir -p out/$p
            (cd $p && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../out/$p/build.log)
            cp $p/app/build/outputs/apk/debug/app-debug.apk out/$p/$p.apk
          done

      - name: Static evidence (dependencies, lint, permissions, dex)
        shell: bash
        continue-on-error: true
        run: |
          AAPT2=$ANDROID_HOME/build-tools/35.0.0/aapt2
          for p in LakeKit-measure LakeKit LakeLog; do
            (cd $p && ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > ../out/$p/dependencies.txt 2>&1 || true)
            (cd $p && ./gradlew lintDebug --no-daemon > ../out/$p/lint.log 2>&1 || true)
            cp $p/app/build/reports/lint-results-debug.txt out/$p/ 2>/dev/null || true
            cp $p/app/build/reports/lint-results-debug.html out/$p/ 2>/dev/null || true
            $AAPT2 dump permissions out/$p/$p.apk > out/$p/apk_permissions.txt 2>&1 || true
            unzip -o -q out/$p/$p.apk 'classes*.dex' -d out/$p/dex
            (grep -c "org/jetbrainz" out/$p/dex/*.dex || true) > out/$p/dex_jetbrainz_count.txt
            rm -rf out/$p/dex
            ls -l out/$p/$p.apk > out/$p/apk_size.txt
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r out/LakeLog/LakeLog.apk && python3 ci/lakelog_check.py out/LakeLog/run 2>&1 | tee out/LakeLog/run.log; adb logcat -d -v time > out/LakeLog/logcat.txt || true
            adb install -r out/LakeKit-measure/LakeKit-measure.apk && python3 ci/lakekit_check.py out/LakeKit-measure/run before 2>&1 | tee out/LakeKit-measure/run.log || true
            adb uninstall edu.msu.cse476.lakekit || true
            adb install -r out/LakeKit/LakeKit.apk && python3 ci/lakekit_check.py out/LakeKit/run after 2>&1 | tee out/LakeKit/run.log || true

      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p out
          echo "commit: ${GITHUB_SHA}" > out/RUN.txt
          echo "status: ${{ job.status }}" >> out/RUN.txt
          cd out
          git init -q -b exam-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Exam results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" exam-results
